# HMIS full stack: `docker compose up -d --build` starts the database, applies migrations, then runs the API and the UI.
# For Visual Studio / ng serve development, start only the database: `docker compose up -d postgres`.
# Secrets come from .env (never committed; copy .env.example). Database credentials are for the local container only.
#
# Production: put a TLS-terminating reverse proxy in front of the UI port (see README.md "Run everything in Docker").
# The sign-in cookie is only marked Secure when the request arrives over HTTPS.
name: hmis

x-api-env: &api-env
  ConnectionStrings__HmisDatabase: Host=postgres;Port=5432;Database=hmis;Username=${HMIS_DB_USER:-hmis};Password=${HMIS_DB_PASSWORD:-hmis_dev_password}
  Jwt__SigningKey: ${HMIS_JWT_SIGNING_KEY:-}
  Identity__SeedAdmin__Password: ${HMIS_SEED_ADMIN_PASSWORD:-}
  DemoData__Enabled: ${HMIS_SEED_DEMO_DATA:-false}

# Container stdout/stderr is kept, but capped, so a long-running host does not fill its disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:17
    container_name: hmis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hmis
      POSTGRES_USER: ${HMIS_DB_USER:-hmis}
      POSTGRES_PASSWORD: ${HMIS_DB_PASSWORD:-hmis_dev_password}
      TZ: UTC
    ports:
      - "${HMIS_DB_PORT:-5434}:5432"
    volumes:
      - hmis-pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d hmis"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrator:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: migrator
    image: hmis-migrator
    container_name: hmis-migrator
    environment:
      <<: *api-env
      ASPNETCORE_ENVIRONMENT: Production
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      target: api
    image: hmis-api
    container_name: hmis-api
    restart: unless-stopped
    environment:
      <<: *api-env
      ASPNETCORE_ENVIRONMENT: ${HMIS_API_ENVIRONMENT:-Production}
      # nginx (service "ui") sends X-Forwarded-For/-Proto. Trusting every sender is safe only because the API port is
      # bound to the host's loopback below, so nothing outside this host can reach the API except through nginx.
      ForwardedHeaders__TrustAll: "true"
    ports:
      # Loopback only: the UI container reaches the API over the compose network (http://api:8080). Publishing the
      # port on all interfaces would let anyone on the network spoof forwarded headers (client IP, HTTPS scheme).
      - "127.0.0.1:${HMIS_API_PORT:-5380}:8080"
    volumes:
      - hmis-api-logs:/app/logs
      - hmis-storage:/app/storage
      - hmis-dpkeys:/home/app/.aspnet/DataProtection-Keys
    logging: *default-logging
    healthcheck:
      # curl is installed in docker/api/Dockerfile (the aspnet runtime image has no curl or wget).
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      migrator:
        condition: service_completed_successfully

  ui:
    build:
      context: .
      dockerfile: docker/ui/Dockerfile
    image: hmis-ui
    container_name: hmis-ui
    restart: unless-stopped
    ports:
      - "${HMIS_UI_PORT:-4380}:80"
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy

  pgadmin:
    image: dpage/pgadmin4:9
    container_name: hmis-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@hmis.local
      PGADMIN_DEFAULT_PASSWORD: ${HMIS_PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  hmis-pgdata:
  hmis-api-logs:
  hmis-storage:
  hmis-dpkeys:
